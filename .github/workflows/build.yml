name: Build Mod

# 云端编译 ModIntegratedStorageCpp —— 本地零依赖，push 即出 dll。
# 对齐 RE-UE4SS 官方 CI (msvc_build_ue4ss.yml) 的构建方式：
#   - xmake 2.9.3（官方锁定版本）
#   - VS DevShell 初始化 MSVC 环境（CMake/ninja 包编译需要）
#   - XMAKE_GLOBALDIR 指向 tool_cache 便于缓存
#   - RE-UE4SS 固定在 commit f12f0bed

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # 手动触发：Actions 页面 → Run workflow

env:
  RE_UE4SS_COMMIT: f12f0bedc34a0e4fdb05f36953686a13dd10641b
  MOD_NAME: ModIntegratedStorageCpp
  CONFIG: Game__Shipping__Win64

jobs:
  build:
    runs-on: windows-2022  # VS 2022 — VS 2026 breaks package builds
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Set xmake globaldir (for caching)
        run: echo "XMAKE_GLOBALDIR=${{ runner.tool_cache }}/xmake-global" >> $env:GITHUB_ENV

      - name: Get cache key (weekly)
        id: cache_key
        run: echo "key=$(date +'%W')" >> $env:GITHUB_OUTPUT

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.3'

      - name: Update xmake repository
        run: xmake repo --update

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: xmake-pkgs-${{ env.CONFIG }}-${{ env.RE_UE4SS_COMMIT }}-W${{ steps.cache_key.outputs.key }}
          restore-keys: |
            xmake-pkgs-${{ env.CONFIG }}-${{ env.RE_UE4SS_COMMIT }}-

      - name: Cache RE-UE4SS build tree (Intermediates)
        uses: actions/cache@v4
        with:
          path: RE-UE4SS\Intermediates
          key: reue4ss-build-${{ env.RE_UE4SS_COMMIT }}-W${{ steps.cache_key.outputs.key }}

      - name: Clone RE-UE4SS (pinned commit, with submodules)
        shell: pwsh
        run: |
          # submodule URLs use SSH; rewrite to HTTPS with PAT (UEPseudo is private)
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git clone https://github.com/UE4SS-RE/RE-UE4SS.git RE-UE4SS
          Push-Location RE-UE4SS
          git checkout $env:RE_UE4SS_COMMIT
          git submodule update --init --recursive
          Pop-Location

      - name: Inject mod into RE-UE4SS tree
        shell: pwsh
        run: |
          $mod = "RE-UE4SS\cppmods\$env:MOD_NAME\src"
          New-Item -ItemType Directory -Force -Path $mod | Out-Null
          Copy-Item src\xmake.lua "RE-UE4SS\cppmods\$env:MOD_NAME\xmake.lua" -Force
          Copy-Item src\dllmain.cpp "RE-UE4SS\cppmods\$env:MOD_NAME\src\dllmain.cpp" -Force
          Write-Host "mod injected into RE-UE4SS\cppmods\$env:MOD_NAME"

      - name: Configure & Build (with VS DevShell)
        shell: pwsh
        run: |
          # Initialize MSVC environment (required for CMake/ninja package builds)
          Import-Module 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Enter-VsDevShell -VsInstallPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' -DevCmdArguments '-arch=x64 -host_arch=x64' -SkipAutomaticLocation

          Push-Location RE-UE4SS
          xmake config -p windows -a x64 -m $env:CONFIG -y
          xmake build -y $env:MOD_NAME
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "xmake build failed (exit $code)" }

      - name: Dump package install logs on failure
        if: failure()
        shell: pwsh
        run: |
          $root = "${{ env.XMAKE_GLOBALDIR }}\.xmake\packages"
          $logs = Get-ChildItem -Path $root -Recurse -Filter "install.txt" -ErrorAction SilentlyContinue
          foreach ($l in $logs) {
            Write-Host "========== $($l.FullName) =========="
            Get-Content $l.FullName | Select-Object -Last 50
          }

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path RE-UE4SS\Intermediates -Recurse -Filter "$env:MOD_NAME.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "compiled $env:MOD_NAME.dll not found under Intermediates" }
          Write-Host "found dll: $($dll.FullName)"
          $dist = "dist\$env:MOD_NAME"
          New-Item -ItemType Directory -Force -Path "$dist\dlls" | Out-Null
          Copy-Item $dll.FullName "$dist\dlls\main.dll" -Force
          New-Item -ItemType File -Force -Path "$dist\enabled.txt" | Out-Null
          New-Item -ItemType File -Force -Path "$dist\config.txt" | Out-Null
          if (Test-Path "$env:MOD_NAME.zip") { Remove-Item "$env:MOD_NAME.zip" -Force }
          Compress-Archive -Path "$dist\*" -DestinationPath "$env:MOD_NAME.zip" -Force
          Write-Host "assembled $dist + $env:MOD_NAME.zip"

      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}
          path: dist\${{ env.MOD_NAME }}

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}.zip
          path: ${{ env.MOD_NAME }}.zip
