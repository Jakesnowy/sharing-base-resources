name: Build Mod (Optimized)

# 云端编译 ModIntegratedStorageCpp —— 本地零依赖，push 即出 dll。
# 使用 xmake 构建（原生 Windows 工具链，比 CMake + Ninja 更简单）
# RE-UE4SS 固定 commit c838a8ac (匹配已安装的 UE4SS v3.0.1 Beta)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'dist/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  RE_UE4SS_COMMIT: c838a8acaade1a0f860bdf249f039e58f4e10088
  MOD_NAME: ModIntegratedStorageCpp
  
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30  # Prevents hanging builds
    
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
        
      - name: Setup MSVC Developer Command Prompt (native, no CMake setup needed)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Clone RE-UE4SS (pinned commit, with submodules, HTTPS+PAT)
        shell: pwsh
        run: |
          # Setup git to use PAT for private submodule
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          
          # Clone RE-UE4SS directly
          Write-Host "Cloning RE-UE4SS..."
          git clone https://github.com/UE4SS-RE/RE-UE4SS.git RE-UE4SS
          Push-Location RE-UE4SS
          git checkout $env:RE_UE4SS_COMMIT
          git submodule update --init --recursive
          Pop-Location
          Write-Host "RE-UE4SS cloned successfully"

      - name: Build mod as standalone xmake project
        shell: pwsh
        run: |
          # Create standalone mod build directory
          $modBuildDir = Join-Path $env:GITHUB_WORKSPACE "build\$($env:MOD_NAME)"
          New-Item -ItemType Directory -Force -Path $modBuildDir | Out-Null
          
          # Copy source files to build directory
          Write-Host "Copying dllmain.cpp..."
          Copy-Item src\dllmain.cpp "$modBuildDir\dllmain.cpp" -Force
          
          # Create xmake.lua for standalone build
          $xmakeContent = @'
set targetproject ""
set projectname "${{ env.MOD_NAME }}"

add_rules("mode.debug", "mode.release")

target "${{ env.MOD_NAME }}"
    setkind "shared"
    addincludes("${{ github.workspace }}/src")
    adddefines("_CRT_SECURE_NO_WARNINGS")
    
    # Polyhook2 dependency (from RE-UE4SS build tree)
    addincludedirs("$(RE_UE4SS_ROOT)/include")
    addsyslibdirs("$(RE_UE4SS_ROOT)/lib/x64")
    
    addsystemlib("polyhook_2")
    
    addfiles("*.cpp")
'@
          
          $xmakePath = Join-Path $modBuildDir "xmake.lua"
          Set-Content -Path $xmakePath -Value $xmakeContent -NoNewline
          
          Write-Host "Created xmake.lua at:"
          Write-Host "  $($xmakePath)"
          
          # Build the mod
          Set-Location $modBuildDir
          Write-Host "`nConfiguring with xmake..."
          .\xmake f -p windows -a x64 --target="${{ env.MOD_NAME }}" -y
          
          if ($LASTEXITCODE -ne 0) {
            throw "xmake configuration failed"
          }
          
          Write-Host "`nBuilding..."
          .\xmake build -v
          
          if ($LASTEXITCODE -ne 0) {
            throw "xmake build failed"
          }

      - name: Verify built DLL exists and is valid
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build\$($env:MOD_NAME)"
          
          if (-not (Test-Path $buildDir)) {
            throw "ERROR: Build directory not found at $buildDir"
          }
          
          $dll = Get-ChildItem -Path $buildDir -Recurse -Filter "$env:MOD_NAME.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\_deps\*" } |
            Select-Object -First 1
          
          if (-not $dll) {
            Write-Host "DLL not found, listing all files:"
            Get-ChildItem $buildDir -Recurse | ForEach-Object { 
              Write-Host "  $($_.FullName)" 
            }
            throw "ERROR: compiled $env:MOD_NAME.dll not found in build directory"
          }
          
          Write-Host "Verified DLL:"
          Write-Host "  File: $($dll.Name)"
          Write-Host "  Size: $($_.Length) bytes"
          Write-Host "  Path: $($dll.FullName)"
          
          # Verify it's a valid PE file
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          if ($bytes.Length -lt 64) { throw "ERROR: DLL too small to be valid PE" }
          
          Write-Host "Verified: Valid PE executable"

      - name: Assemble installable mod package
        shell: pwsh
        run: |
          # Find the built DLL
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build\$($env:MOD_NAME)"
          
          if (-not (Test-Path $buildDir)) {
            throw "ERROR: Build directory not found at $buildDir"
          }
          
          $dll = Get-ChildItem -Path $buildDir -Recurse -Filter "$env:MOD_NAME.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\_deps\*" } |
            Select-Object -First 1
          
          if (-not $dll) {
            throw "ERROR: compiled $env:MOD_NAME.dll not found in build directory"
          }
          
          Write-Host "found dll: $($dll.FullName)"
          
          # Create installable package structure
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\$($env:MOD_NAME)"
          New-Item -ItemType Directory -Force -Path "$dist\dlls" | Out-Null
          
          # Copy DLL to dlls directory
          Copy-Item $dll.FullName "$dist\dlls\main.dll" -Force
          
          # Create enabled.txt (enables the mod)
          New-Item -ItemType File -Force -Path "$dist\enabled.txt" | Out-Null
          
          # Use the repo's config.txt with full Chinese comments
          if (Test-Path "dist\$env:MOD_NAME\config.txt") {
            Copy-Item "dist\$env:MOD_NAME\config.txt" "$dist\config.txt" -Force
            Write-Host "using config.txt from repository:"
            Get-Content "dist\$env:MOD_NAME\config.txt" | ForEach-Object { Write-Host "  $_" }
          } else {
            throw "ERROR: dist/$($env:MOD_NAME)/config.txt missing. Zero-config mode requires this file!"
          }
          
          # Create zip package for easy distribution
          if (Test-Path "$env:MOD_NAME.zip") { Remove-Item "$env:MOD_NAME.zip" -Force }
          Compress-Archive -Path "$dist\*" -DestinationPath "$env:MOD_NAME.zip" -Force
          
          Write-Host "Created package:"
          Write-Host "  dist\$($env:MOD_NAME) (folder)"
          Write-Host "  $env:MOD_NAME.zip (compressed package)"
          
          # List contents for verification
          Write-Host "`nPackage contents:"
          Get-ChildItem "$dist" | ForEach-Object { 
            $size = if ($_.Length -gt 0) { $_.Length } else { "N/A" }
            Write-Host "  - $_.Name ($size bytes)" 
          }

      - name: Upload mod zip artifact (primary distribution package)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}.zip
          path: ${{ env.MOD_NAME }}.zip
          retention-days: 30

<EOF>